internal_token = "replace-with-a-random-token"
server_ws_url = "ws://127.0.0.1:8765/ws/client"
log_level = "INFO"

[client]
client_name = "classroom-desktop"
# schedule_source = "schedule/schedule.json"    # uncomment to pin a JSON schedule
# schedule_source = "__classisland__"            # or use ClassIsland real-time events
# last_valid_schedule_source = "schedule/schedule.json"

# "auto"  = prefer live ClassIsland events; fall back to the locally imported
#           timetable when ClassIsland.Desktop.exe is not running
# "local" = only ever use the locally imported timetable
schedule_mode = "auto"
# Seconds to wait after a break starts before showing the popup (0 = immediate)
break_popup_delay_seconds = 0
# Optional explicit path to the ClassIsland.WSBridge.exe bridge.
# Leave empty to auto-detect: <project>/bin/, then sys._MEIPASS/bin/ (frozen).
cib_exe_path = ""
classisland_ws_url = "ws://localhost:6614/"
ntp_server = "ntp.aliyun.com"
auto_popup_on_break = true
close_to_tray = true
enable_urgent_sound = true
history_retention_days = 180
urgent_remind_default_minutes = 10
reconnect_initial_delay_seconds = 1
reconnect_max_delay_seconds = 60

[schedule]
timezone = "Asia/Shanghai"

[challenge]
challenge_url = "http://127.0.0.1:6666/challenge"
verify_url = "http://127.0.0.1:6666/verify"
fallback_question = "密码"
fallback_answer = "replace-with-a-strong-password"
