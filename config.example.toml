# ==========================================
# ClassBridge 统一配置文件（模板）
# ==========================================
# 复制为 config.toml 后按需修改：
#     cp config.example.toml config.toml
#
# 本文件同时供 server（消息转发服务）与 plugin（NoneBot 插件）读取。
# 修改后：server 重启或经 admin 控制台“保存并热重载”；plugin 会自动检测文件变化热重载。

# 当前激活的环境: "dev" (开发测试) 或 "prod" (生产运行)
active_env = "dev"

# 安全通信 Token (Server 与 Plugin 内部 WS 握手校验)
internal_token = "replace-with-a-random-token"

# Web 管理后台接口鉴权密钥 (用于 admin.html，请求头 X-Admin-Token)
admin_secret_token = "replace-with-admin-secret-key"

# 消息短 ID 有效期（秒）
short_id_ttl_seconds = 300

# ------------------------------------------
# 环境特定配置 (Dev / Prod)
# ------------------------------------------
[environments.dev]
env_name = "开发测试环境"
server_host = "127.0.0.1"
server_port = 8765
class_group_ids = [825942382]
admin_users = [123456789]
debug_mode = true

[environments.prod]
env_name = "生产运行环境"
server_host = "0.0.0.0"
server_port = 8765
class_group_ids = [987654321]
admin_users = [847888526, 523535941, 763705194]
debug_mode = false

# ------------------------------------------
# 服务端 & 插件基础固定参数
# ------------------------------------------
[server]
database_path = "data/app.db"
log_level = "INFO"
client_ws_path = "/ws/client"
plugin_ws_path = "/ws/plugin"
client_name = "classroom-desktop"
# 管理后台 HTTP API 监听地址与端口（与 WebSocket 端口分开，避免冲突）
# 0.0.0.0 = 允许外网/其他机器访问控制台（务必依赖 admin_secret_token 保护，
# 并建议在防火墙中限制来源 IP）；仅本机使用可改为 127.0.0.1
admin_host = "0.0.0.0"
admin_port = 8766

[plugin]
bot_name = "kgGao29MessageBot"

[ai]
enabled = true
api_key = "sk-your-key-here"
api_url = "https://api.deepseek.com/beta"
model = "deepseek-flash"
